<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7f6;color:#173b35}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:430px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.13)}

.content{padding:25px}
.action{display:flex;align-items:center;gap:15px;text-decoration:none;color:#173b35;border:1px solid #dce7e3;border-radius:16px;padding:15px 16px;margin-bottom:12px;background:#fff}
.icon{width:42px;height:42px;border-radius:13px;background:#eaf5f2;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.small{font-size:12px;color:#71847f;margin-bottom:3px}
.value{font-size:15px;font-weight:600;word-break:break-word}
.save{display:block;text-align:center;text-decoration:none;background:#075b48;color:white;font-weight:700;padding:17px;border-radius:16px;margin-top:20px}
.footer{text-align:center;font-size:12px;color:#81908c;padding:2px 20px 25px}

</head>
